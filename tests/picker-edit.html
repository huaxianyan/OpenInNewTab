<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>可视化编辑行为测试</title>
  <link rel="stylesheet" href="../picker.css">
  <style>a { display: block; width: 180px; height: 28px; margin: 8px; }</style>
  <script>
    const nativeAttachShadow = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (options) {
      return nativeAttachShadow.call(this, { ...options, mode: "open" });
    };

    let pickerListener;
    let savedRule;
    globalThis.chrome = {
      runtime: {
        lastError: null,
        onMessage: { addListener: (listener) => { pickerListener = listener; } },
        sendMessage: (message, callback) => {
          savedRule = message;
          callback?.({ saved: true });
        }
      }
    };
  </script>
</head>
<body>
  <a class="topic" href="/read.php?tid=1">主题</a>
  <a class="topic pagination" href="/read.php?page=2">下一页</a>
  <a class="topic author" href="/read.php?author=1">作者主题</a>
  <output id="result">等待测试</output>

  <script src="../rules.js"></script>
  <script src="../picker.js"></script>
  <script>
    setTimeout(() => {
      pickerListener({
        type: "start-link-picker",
        pagePattern: "https://bbs.nga.cn/*",
        revokePermissionOnCancel: false,
        editingRule: {
          id: "existing-rule",
          name: "NGA 主题",
          enabled: true,
          pagePattern: "https://bbs.nga.cn/*",
          linkSelector: "a.topic",
          excludeSelector: "a.pagination, a.author",
          mode: "force"
        }
      });

      const toolbar = document.querySelector("#open-links-picker-toolbar").shadowRoot;
      const previews = toolbar.querySelectorAll(".exclusion-preview");
      previews[1].click();
      const focused = document.querySelector("a.author").hasAttribute(
        "data-open-links-picker-excluded"
      );
      const otherMuted = document.querySelector("a.pagination").hasAttribute(
        "data-open-links-picker-muted-excluded"
      );
      const restoredMode = toolbar.querySelector(".mode select").value === "force";
      toolbar.querySelector(".save").click();

      const passed = previews.length === 2 && focused && otherMuted && restoredMode &&
        savedRule?.ruleId === "existing-rule" &&
        savedRule?.linkSelector === "a.topic" &&
        savedRule?.excludeSelector === "a.pagination, a.author";
      document.querySelector("#result").textContent = passed ? "PASS" : "FAIL";
      document.body.dataset.result = passed ? "pass" : "fail";
    }, 0);
  </script>
</body>
</html>
